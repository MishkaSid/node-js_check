<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<script>

const json = {info}

document.addEventListener('DOMContentLoaded',()=>{

  document.getElementById( 'user' ).innerHTML = `
  
  <p>ID : ${json.id}</p>
  <p> Name : ${json.name}</p>
  <p> Email: ${json.email} </p>
  <p> Age: ${json.age} </p>
  `

})

</script>

<body>

  <h1>User</h1>
  <p id="user"></p>

</body>
</html>
